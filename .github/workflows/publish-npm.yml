name: Publish npm

on:
  # Auto-publish: creating a GitHub Release (gh release create vX.Y.Z) fires this.
  release:
    types: [published]
  # Manual fallback / dry-run rehearsal.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all release checks but do not publish"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14"
          cache: npm
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 only bundles npm 10.x.
      # Pinned exact (not a range) for Scorecard pinned-dependencies (#9).
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm run check:types
      - run: npm test
      - run: npm run test:update
      - run: npm run smoke
      - run: npm run pack:check

      - name: Publish core
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        run: npm publish --workspace=@bastra-recall/core --access public --provenance --tag latest

      - name: Publish statusline
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        run: npm publish --workspace=@bastra-recall/statusline --access public --provenance --tag latest

      - name: Publish daemon
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        run: npm publish --workspace=@bastra-recall/daemon --access public --provenance --tag latest

      - name: Publish bastra-recall (unscoped wrapper)
        if: ${{ github.event_name == 'release' || inputs.dry_run == 'false' }}
        run: npm publish --workspace=bastra-recall --access public --provenance --tag latest

  desktop-extension:
    # Claude Desktop Extension (.mcpb): built from the SAME checkout the npm
    # packages were published from (workspace tarballs — no registry
    # propagation race) and attached to the GitHub release as an asset.
    # #281: each bundle ships with a .sha256 file (the CLI verifies it after
    # download) and a Sigstore attestation (`gh attestation verify <file>
    # --repo n0mad-ai/bastra-recall`) — the npm packages already carry
    # --provenance, this closes the same gap for the release asset.
    if: ${{ github.event_name == 'release' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:mcpb:local --workspace=@bastra-recall/daemon
      - name: Checksum the bundle
        working-directory: packages/daemon/mcpb
        run: |
          for f in *.mcpb; do
            sha256sum "$f" > "$f.sha256"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/daemon/mcpb/*.mcpb
      - name: Attach extension to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" packages/daemon/mcpb/*.mcpb packages/daemon/mcpb/*.mcpb.sha256 --clobber

  installer-scripts:
    # Double-click installer + uninstaller (#306): README A) sends non-coders to
    # the latest release for these two files, but they only ever lived in
    # distribution/ — the documented download resolved to nothing. Own job (no
    # build, no `needs`) so the documented entry point is published even if the
    # npm or .mcpb step fails. NOTE: GitHub normalizes spaces in asset names to
    # dots, so they appear as `Install.Bastra.command` / `Uninstall.Bastra.command`.
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Attach installer scripts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "distribution/Install Bastra.command" \
            "distribution/Uninstall Bastra.command" \
            --clobber

